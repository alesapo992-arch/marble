<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Border Collie Herding · Draw-to-move</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #173d1c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }

    #game {
      position: fixed;
      inset: 0;
      display: block;
      touch-action: none;
    }

    #restart {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      z-index: 20;
      background: rgba(15, 28, 18, 0.88);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 18px;
      touch-action: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(4, 12, 6, 0.78);
      z-index: 30;
      padding: 20px;
    }

    #overlayCard {
      max-width: 560px;
      width: 100%;
      color: #fff;
      text-align: center;
      background: rgba(12, 32, 18, 0.94);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px;
      padding: 26px 20px;
      box-shadow: 0 20px 70px rgba(0,0,0,0.45);
    }

    #overlayCard h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: 1px;
    }

    #overlayCard p {
      margin: 10px 0;
      line-height: 1.5;
      color: rgba(255,255,255,0.88);
      font-size: 16px;
    }

    #ovBtn {
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      padding: 14px 24px;
      font-size: 20px;
      font-weight: 800;
      color: #07130a;
      background: #86efac;
      touch-action: manipulation;
    }

    .small {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <button id="restart">↻</button>

  <div id="overlay">
    <div id="overlayCard">
      <h1 id="ovTitle">BORDER COLLIE HERDING</h1>
      <p id="ovBody">
        Prototype draw-to-move<br><br>
        <b>DISEGNA</b> il percorso del Border Collie<br>
        <b>TAP RAPIDO</b> = abbaio / morso alle caviglie<br>
        <b>OBIETTIVO</b> = porta tutte le pecore nel recinto<br><br>
        Più sei veloce, migliore è il tempo finale.
      </p>
      <button id="ovBtn">INIZIA ▶</button>
      <p class="small">Niente AI · grafica placeholder · solo calibrazione movimento e gregge</p>
    </div>
  </div>

  <script>
    'use strict';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovBody = document.getElementById('ovBody');
    const ovBtn = document.getElementById('ovBtn');
    const restartBtn = document.getElementById('restart');

    // ------------------------------------------------------------
    // COSTANTI DI CALIBRAZIONE
    // ------------------------------------------------------------

    // Cane
    const DOG_SPEED = 285;
    const DOG_STEER = 9.5;
    const DOG_LOOKAHEAD = 46;

    // Disegno percorso
    const DRAW_MIN_POINT_DIST = 10;
    const PATH_PRUNE_RADIUS = 16;

    // Abbaio / morso
    const BARK_TIME = 0.45;
    const DOG_RADIUS = 98;
    const BARK_RADIUS = 185;
    const FLEE_FORCE = 520;
    const BARK_FORCE = 1150;

    // Pecore
    const SHEEP_COUNT = 8;
    const SHEEP_MAX_SPEED = 125;
    const SHEEP_MAX_SPEED_PANIC = 195;
    const PERCEPTION = 78;
    const SEPARATION_DIST = 30;

    const COHESION = 1.35;
    const ALIGNMENT = 2.1;
    const SEPARATION = 210;

    const PEN_PULL_ACTIVE = 56;
    const PEN_PULL_NEAR = 30;
    const BOUNDARY_FORCE = 620;
    const FRICTION = 1.35;

    // ------------------------------------------------------------
    // VIEW / RESIZE
    // ------------------------------------------------------------
    let dpr = 1;
    let viewW = 0;
    let viewH = 0;

    const pen = {
      x: 0,
      y: 0,
      w: 0,
      h: 0
    };

    const dog = {
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      angle: -Math.PI / 2,
      bark: 0
    };

    let sheep = [];
    let path = [];

    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      viewW = window.innerWidth;
      viewH = window.innerHeight;

      canvas.width = Math.floor(viewW * dpr);
      canvas.height = Math.floor(viewH * dpr);
      canvas.style.width = viewW + 'px';
      canvas.style.height = viewH + 'px';

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      pen.w = Math.min(300, viewW * 0.68);
      pen.h = Math.max(110, viewH * 0.16);
      pen.x = (viewW - pen.w) / 2;
      pen.y = Math.max(68, viewH * 0.10);

      dog.x = clamp(dog.x || viewW / 2, 18, viewW - 18);
      dog.y = clamp(dog.y || viewH - 120, 18, viewH - 18);

      for (const s of sheep) {
        s.x = clamp(s.x, 16, viewW - 16);
        s.y = clamp(s.y, 16, viewH - 16);
      }
    }

    window.addEventListener('resize', resize);
    resize();

    // ------------------------------------------------------------
    // STATO GIOCO
    // ------------------------------------------------------------
    let state = 'ready'; // ready | play | end
    let time = 0;
    let animTime = 0;
    let pennedCount = 0;

    let best = 0;
    try {
      best = Number(localStorage.getItem('bc_herding_best') || 0);
    } catch (err) {
      best = 0;
    }

    const pointer = {
      down: false,
      id: null,
      startX: 0,
      startY: 0,
      lastX: 0,
      lastY: 0,
      downTime: 0,
      moved: false
    };

    let drawing = false;

    // ------------------------------------------------------------
    // HELPERS
    // ------------------------------------------------------------
    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function dist(x1, y1, x2, y2) {
      return Math.hypot(x2 - x1, y2 - y1);
    }

    function formatTime(t) {
      return t.toFixed(1) + 's';
    }

    function getPenSpot(index) {
      const cols = Math.max(2, Math.floor(pen.w / 62));
      const col = index % cols;
      const row = Math.floor(index / cols);

      const spacingX = (pen.w - 56) / Math.max(1, cols - 1);

      return {
        x: pen.x + 28 + col * spacingX,
        y: pen.y + 34 + row * 34
      };
    }

    function initField() {
      time = 0;
      pennedCount = 0;
      path = [];

      dog.x = viewW / 2;
      dog.y = viewH - 120;
      dog.vx = 0;
      dog.vy = 0;
      dog.angle = -Math.PI / 2;
      dog.bark = 0;

      sheep = [];

      for (let i = 0; i < SHEEP_COUNT; i++) {
        sheep.push({
          x: viewW * (0.24 + Math.random() * 0.52),
          y: viewH * (0.38 + Math.random() * 0.24),
          vx: 0,
          vy: 0,
          angle: -Math.PI / 2,
          penned: false,
          penTimer: 0,
          spotX: 0,
          spotY: 0,
          wobble: Math.random() * 100
        });
      }
    }

    function startGame() {
      initField();
      state = 'play';
      overlay.style.display = 'none';
    }

    function endGame() {
      state = 'end';

      if (best === 0 || time < best) {
        best = time;
        try {
          localStorage.setItem('bc_herding_best', String(best));
        } catch (err) {}
      }

      ovTitle.textContent = 'GREGGE RADUNATO!';
      ovBody.innerHTML = `
        Tutte le pecore sono nel recinto.<br><br>
        Tempo: <b>${formatTime(time)}</b><br>
        Migliore: <b>${formatTime(best)}</b><br><br>
        <span class="small">Prossimo step: grafica Border Collie vera, versi, ostacoli e livelli.</span>
      `;
      ovBtn.textContent = 'RIPROVA ↻';
      overlay.style.display = 'flex';
    }

    ovBtn.addEventListener('click', () => {
      startGame();
    });

    restartBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
    });

    restartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startGame();
    });

    // ------------------------------------------------------------
    // INPUT DRAW-TO-MOVE
    // ------------------------------------------------------------
    function addPathPoint(x, y) {
      if (path.length === 0) {
        path.push({ x: dog.x, y: dog.y });
      }

      const last = path[path.length - 1];
      const d = dist(x, y, last.x, last.y);

      if (d < DRAW_MIN_POINT_DIST) return false;
      if (path.length > 420) return false;

      path.push({
        x: clamp(x, 12, viewW - 12),
        y: clamp(y, 12, viewH - 12)
      });

      return true;
    }

    function pDown(x, y, id) {
      if (state !== 'play') return;

      pointer.down = true;
      pointer.id = id;
      pointer.startX = x;
      pointer.startY = y;
      pointer.lastX = x;
      pointer.lastY = y;
      pointer.downTime = performance.now();
      pointer.moved = false;
      drawing = false;
      path = [];
    }

    function pMove(x, y) {
      if (!pointer.down) return;

      const dStart = dist(x, y, pointer.startX, pointer.startY);

      if (!drawing) {
        if (dStart > 12) {
          drawing = true;
          pointer.moved = true;
          path = [{ x: dog.x, y: dog.y }];
          addPathPoint(x, y);
          pointer.lastX = x;
          pointer.lastY = y;
        }
        return;
      }

      if (addPathPoint(x, y)) {
        pointer.lastX = x;
        pointer.lastY = y;
      }
    }

    function pUp(x, y) {
      if (!pointer.down) return;

      pointer.down = false;

      const duration = performance.now() - pointer.downTime;

      if (!drawing && duration < 250) {
        bark();
      }

      drawing = false;
    }

    function bark() {
      dog.bark = BARK_TIME;

      if (navigator.vibrate) {
        try {
          navigator.vibrate(18);
        } catch (err) {}
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      pDown(e.clientX, e.clientY, e.pointerId);

      try {
        canvas.setPointerCapture(e.pointerId);
      } catch (err) {}
    });

    window.addEventListener('pointermove', (e) => {
      if (pointer.down && e.pointerId === pointer.id) {
        pMove(e.clientX, e.clientY);
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (pointer.down && e.pointerId === pointer.id) {
        pUp(e.clientX, e.clientY);
      }
    });

    window.addEventListener('pointercancel', (e) => {
      if (pointer.down && e.pointerId === pointer.id) {
        pUp(e.clientX, e.clientY);
      }
    });

    if (!window.PointerEvent) {
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.changedTouches[0];
        pDown(t.clientX, t.clientY, 'touch');
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        if (!pointer.down) return;
        e.preventDefault();
        const t = e.changedTouches[0];
        pMove(t.clientX, t.clientY);
      }, { passive: false });

      window.addEventListener('touchend', (e) => {
        if (!pointer.down) return;
        const t = e.changedTouches[0];
        pUp(t.clientX, t.clientY);
      }, { passive: false });

      window.addEventListener('touchcancel', (e) => {
        if (!pointer.down) return;
        const t = e.changedTouches[0];
        pUp(t.clientX, t.clientY);
      }, { passive: false });
    }

    document.addEventListener('touchmove', (e) => {
      if (state === 'play') {
        e.preventDefault();
      }
    }, { passive: false });

    // ------------------------------------------------------------
    // PATH FOLLOWING
    // ------------------------------------------------------------
    function prunePath() {
      while (
        path.length > 1 &&
        dist(path[0].x, path[0].y, dog.x, dog.y) < PATH_PRUNE_RADIUS
      ) {
        path.shift();
      }
    }

    function getPathTarget() {
      if (path.length === 0) return null;
      if (path.length === 1) return path[0];

      let remaining = DOG_LOOKAHEAD;

      for (let i = 0; i < path.length - 1; i++) {
        const a = path[i];
        const b = path[i + 1];
        const d = dist(a.x, a.y, b.x, b.y);

        if (d >= remaining) {
          const t = remaining / d;
          return {
            x: a.x + (b.x - a.x) * t,
            y: a.y + (b.y - a.y) * t
          };
        }

        remaining -= d;
      }

      return path[path.length - 1];
    }

    function updateDog(dt) {
      dog.bark = Math.max(0, dog.bark - dt);

      prunePath();

      const target = getPathTarget();

      let desiredVx = 0;
      let desiredVy = 0;

      if (target) {
        const dx = target.x - dog.x;
        const dy = target.y - dog.y;
        const d = Math.hypot(dx, dy);

        if (d > 1) {
          const speed = Math.min(DOG_SPEED, d * 7);
          desiredVx = (dx / d) * speed;
          desiredVy = (dy / d) * speed;
        }
      }

      const steer = Math.min(1, dt * DOG_STEER);

      dog.vx += (desiredVx - dog.vx) * steer;
      dog.vy += (desiredVy - dog.vy) * steer;

      dog.x += dog.vx * dt;
      dog.y += dog.vy * dt;

      dog.x = clamp(dog.x, 16, viewW - 16);
      dog.y = clamp(dog.y, 16, viewH - 16);

      const speed = Math.hypot(dog.vx, dog.vy);
      if (speed > 8) {
        dog.angle = Math.atan2(dog.vy, dog.vx);
      }
    }

    // ------------------------------------------------------------
    // SHEEP FLOCKING
    // ------------------------------------------------------------
    function updateSheep(dt) {
      const penCx = pen.x + pen.w / 2;
      const penCy = pen.y + pen.h / 2;

      for (let i = 0; i < sheep.length; i++) {
        const s = sheep[i];

        if (s.penned) {
          const dx = s.spotX - s.x;
          const dy = s.spotY - s.y;

          s.x += dx * Math.min(1, dt * 5);
          s.y += dy * Math.min(1, dt * 5);

          s.vx = 0;
          s.vy = 0;
          continue;
        }

        let ax = 0;
        let ay = 0;

        let count = 0;
        let centerX = 0;
        let centerY = 0;
        let avgVx = 0;
        let avgVy = 0;
        let sepX = 0;
        let sepY = 0;

        for (let j = 0; j < sheep.length; j++) {
          if (i === j) continue;

          const o = sheep[j];
          if (o.penned) continue;

          const d = dist(s.x, s.y, o.x, o.y);

          if (d < PERCEPTION) {
            count++;
            centerX += o.x;
            centerY += o.y;
            avgVx += o.vx;
            avgVy += o.vy;

            if (d < SEPARATION_DIST && d > 0.001) {
              const push = 1 - d / SEPARATION_DIST;
              sepX += ((s.x - o.x) / d) * push;
              sepY += ((s.y - o.y) / d) * push;
            }
          }
        }

        if (count > 0) {
          centerX /= count;
          centerY /= count;
          avgVx /= count;
          avgVy /= count;

          // Coesione
          ax += (centerX - s.x) * COHESION;
          ay += (centerY - s.y) * COHESION;

          // Allineamento
          ax += (avgVx - s.vx) * ALIGNMENT;
          ay += (avgVy - s.vy) * ALIGNMENT;

          // Separazione
          ax += sepX * SEPARATION;
          ay += sepY * SEPARATION;
        }

        // Fuga dal cane
        const dxDog = s.x - dog.x;
        const dyDog = s.y - dog.y;
        const dDog = Math.hypot(dxDog, dyDog);

        const radius = dog.bark > 0 ? BARK_RADIUS : DOG_RADIUS;
        const force = dog.bark > 0 ? BARK_FORCE : FLEE_FORCE;

        let fleeing = false;

        if (dDog < radius && dDog > 0.001) {
          const f = (1 - dDog / radius) * force;
          ax += (dxDog / dDog) * f;
          ay += (dyDog / dDog) * f;
          fleeing = true;
        }

        // Attrazione verso il recinto
        const toPenX = penCx - s.x;
        const toPenY = penCy - s.y;
        const penDist = Math.hypot(toPenX, toPenY);

        if (penDist > 1) {
          let pull = 0;

          if (dog.y > s.y + 12) {
            pull = fleeing ? PEN_PULL_ACTIVE : 12;
          }

          if (s.y < pen.y + pen.h + 90) {
            pull = Math.max(pull, PEN_PULL_NEAR);
          }

          ax += (toPenX / penDist) * pull;
          ay += (toPenY / penDist) * pull;
        }

        // Bordi campo
        const margin = 42;

        if (s.x < margin) {
          ax += BOUNDARY_FORCE * (1 - s.x / margin);
        }

        if (s.x > viewW - margin) {
          ax -= BOUNDARY_FORCE * (1 - (viewW - s.x) / margin);
        }

        if (s.y < margin) {
          ay += BOUNDARY_FORCE * (1 - s.y / margin);
        }

        if (s.y > viewH - margin) {
          ay -= BOUNDARY_FORCE * (1 - (viewH - s.y) / margin);
        }

        // Integrazione
        s.vx += ax * dt;
        s.vy += ay * dt;

        const panic = dog.bark > 0 && dDog < radius;
        const maxSpeed = panic ? SHEEP_MAX_SPEED_PANIC : SHEEP_MAX_SPEED;

        const speed = Math.hypot(s.vx, s.vy);

        if (speed > maxSpeed) {
          s.vx *= maxSpeed / speed;
          s.vy *= maxSpeed / speed;
        }

        s.vx *= Math.max(0, 1 - dt * FRICTION);
        s.vy *= Math.max(0, 1 - dt * FRICTION);

        s.x += s.vx * dt;
        s.y += s.vy * dt;

        s.x = clamp(s.x, 14, viewW - 14);
        s.y = clamp(s.y, 14, viewH - 14);

        if (Math.hypot(s.vx, s.vy) > 6) {
          s.angle = Math.atan2(s.vy, s.vx);
        }

        // Recinto
        const insidePen =
          s.x > pen.x &&
          s.x < pen.x + pen.w &&
          s.y > pen.y &&
          s.y < pen.y + pen.h;

        if (insidePen) {
          s.penTimer += dt;

          if (s.penTimer > 0.35) {
            s.penned = true;
            const spot = getPenSpot(pennedCount);
            s.spotX = spot.x;
            s.spotY = spot.y;
            pennedCount++;
          }
        } else {
          s.penTimer = 0;
        }
      }

      if (pennedCount >= SHEEP_COUNT) {
        endGame();
      }
    }

    // ------------------------------------------------------------
    // DRAW
    // ------------------------------------------------------------
    function drawField() {
      const g = ctx.createLinearGradient(0, 0, 0, viewH);
      g.addColorStop(0, '#2f7a35');
      g.addColorStop(1, '#1d5323');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, viewW, viewH);

      // texture prato semplice
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      for (let i = 0; i < 24; i++) {
        const x = (i * 173) % viewW;
        const y = (i * 239) % viewH;
        ctx.fillRect(x, y, 3, 3);
      }
    }

    function drawPen() {
      ctx.save();

      ctx.fillStyle = 'rgba(255,244,214,0.10)';
      ctx.fillRect(pen.x, pen.y, pen.w, pen.h);

      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 3;
      ctx.strokeRect(pen.x, pen.y, pen.w, pen.h);

      // paletti
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      const posts = 6;
      for (let i = 0; i <= posts; i++) {
        const px = pen.x + (pen.w / posts) * i;
        ctx.fillRect(px - 2, pen.y - 10, 4, 10);
        ctx.fillRect(px - 2, pen.y + pen.h, 4, 10);
      }

      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = 'bold 18px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('RECINTO', pen.x + pen.w / 2, pen.y - 18);

      ctx.restore();
    }

    function drawPath() {
      if (path.length < 2) return;

      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.lineWidth = 3;
      ctx.setLineDash([7, 9]);
      ctx.beginPath();
      ctx.moveTo(path[0].x, path[0].y);

      for (let i = 1; i < path.length; i++) {
        ctx.lineTo(path[i].x, path[i].y);
      }

      ctx.stroke();
      ctx.restore();
    }

    function drawSheep(s) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.angle);

      const wiggle = s.penned ? 0 : Math.sin(animTime * 8 + s.wobble) * 1.2;

      // corpo
      ctx.fillStyle = s.penned ? 'rgba(255,255,255,0.82)' : '#fff';
      ctx.beginPath();
      ctx.ellipse(0, wiggle * 0.2, 13, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // lana
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // testa
      ctx.fillStyle = '#1f2937';
      ctx.beginPath();
      ctx.ellipse(12, 0, 5.5, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // orecchie
      ctx.beginPath();
      ctx.ellipse(10, -5, 3.5, 2, -0.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(10, 5, 3.5, 2, 0.5, 0, Math.PI * 2);
      ctx.fill();

      // coda
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-13, 0, 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawDog() {
      ctx.save();
      ctx.translate(dog.x, dog.y);

      // raggio abbaio
      if (dog.bark > 0) {
        const alpha = dog.bark / BARK_TIME;
        ctx.strokeStyle = `rgba(255,255,255,${0.55 * alpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, BARK_RADIUS * (1 - alpha * 0.25), 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.rotate(dog.angle);

      const tailWag = Math.sin(animTime * 18) * 6;

      // coda
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-15, 0);
      ctx.quadraticCurveTo(-25, tailWag, -30, tailWag * 0.4);
      ctx.stroke();

      // corpo
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.ellipse(0, 0, 18, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // dorso nero
      ctx.fillStyle = '#111827';
      ctx.beginPath();
      ctx.ellipse(-4, 0, 11, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      // testa
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(17, 0, 8, 0, Math.PI * 2);
      ctx.fill();

      // muso
      ctx.beginPath();
      ctx.ellipse(22, 0, 4.5, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // macchia testa
      ctx.fillStyle = '#111827';
      ctx.beginPath();
      ctx.arc(15, -3, 5, Math.PI * 0.8, Math.PI * 2.05);
      ctx.fill();

      // orecchie
      ctx.beginPath();
      ctx.moveTo(12, -6);
      ctx.lineTo(8, -13);
      ctx.lineTo(16, -9);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(15, -7);
      ctx.lineTo(18, -14);
      ctx.lineTo(22, -6);
      ctx.closePath();
      ctx.fill();

      // naso
      ctx.fillStyle = '#0b1020';
      ctx.beginPath();
      ctx.arc(26, 0, 1.8, 0, Math.PI * 2);
      ctx.fill();

      // occhio
      ctx.beginPath();
      ctx.arc(18, -2, 1.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawHUD() {
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.fillRect(0, 0, viewW, 56);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px system-ui';
      ctx.textAlign = 'left';
      ctx.fillText(`⏱ ${formatTime(time)}`, 14, 34);

      ctx.textAlign = 'center';
      ctx.fillText(`🐑 ${pennedCount}/${SHEEP_COUNT}`, viewW / 2, 34);

      ctx.textAlign = 'right';
      ctx.font = '15px system-ui';
      ctx.fillText(`BEST ${best > 0 ? formatTime(best) : '-'}`, viewW - 14, 34);

      ctx.textAlign = 'center';
      ctx.font = '14px system-ui';
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillText('DISEGNA il percorso · TAP = abbaio', viewW / 2, viewH - 14);
    }

    function draw() {
      ctx.clearRect(0, 0, viewW, viewH);

      drawField();
      drawPen();
      drawPath();

      for (const s of sheep) {
        drawSheep(s);
      }

      drawDog();
      drawHUD();
    }

    // ------------------------------------------------------------
    // LOOP
    // ------------------------------------------------------------
    let last = performance.now();

    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;

      animTime += dt;

      if (state === 'play') {
        time += dt;
        updateDog(dt);
        updateSheep(dt);
      }

      draw();
      requestAnimationFrame(frame);
    }

    initField();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
